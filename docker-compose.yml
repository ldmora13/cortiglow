services:
  db:
    image: postgres:16-alpine
    container_name: cortiglow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: cortiglow_db
    ports:
      - "5432:5432"
    volumes:
      - cortiglow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cortiglow_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cortiglow_pgdata: